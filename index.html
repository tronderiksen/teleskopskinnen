<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teleskopskinnen – Raskere jobb, tryggere feste</title>
  <meta name="description" content="Teleskopskinnen utvikler produkter som hjelper rørleggere å jobbe raskere og bedre med rør-i-rør-systemer.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --ink: #111;
      --blue: #1d3f8a;
      --muted: #555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 640px; }
    img { width: 100%; max-width: 520px; height: auto; margin-bottom: 40px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.25; margin-bottom: 16px; }
    p { font-size: 1.125rem; line-height: 1.6; color: var(--muted); }
    .soon { margin-top: 24px; color: var(--blue); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Teleskopskinnen – Raskere jobb, tryggere feste">
    <h1>Smartere verktøy for rør-i-rør</h1>
    <p>Vi utvikler produkter som hjelper rørleggere å jobbe raskere og bedre med rør-i-rør-systemer.</p>
    <p class="soon">Nye produkter kommer snart.</p>
  </main>
</body>
</html>
