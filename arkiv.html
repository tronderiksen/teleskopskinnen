<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Arkiv – Teleskopskinnen</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="arkiv.css">
</head>
<body>
  <main>
    <header>
      <a href="/"><img src="logo.png" alt="Teleskopskinnen"></a>
      <h1>Arkiv</h1>
      <p class="sub">Alle opplastede videoer</p>
    </header>

    <!-- INNLOGGING -->
    <section class="card" id="login">
      <label for="pw">Passord</label>
      <input type="password" id="pw" autocomplete="current-password">
      <button class="btn" id="login-btn">Logg inn</button>
      <p class="error" id="login-error"></p>
    </section>

    <div id="app" class="hidden">
      <section class="card folder hidden" id="folder">
        <p>Nedlastinger lagres i: <strong id="folder-name">ingen mappe valgt</strong></p>
        <button id="folder-btn">Velg mappe</button>
      </section>

      <section class="card">
        <h2>Alle videoer</h2>
        <div id="list"><p class="empty">Laster…</p></div>
      </section>
      <p style="text-align:center"><button class="logout" id="logout">Logg ut</button></p>
    </div>
  </main>

  <script>
    const WORKER_URL = 'https://teleskopskinnen-arkiv.trondfe.workers.dev';

    const $ = id => document.getElementById(id);
    const store = {
      get: k => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      del: k => { try { localStorage.removeItem(k); } catch {} },
    };

    let password = store.get('arkiv-pw') || '';

    // ── Nedlastingsmappe (Chrome/Edge på Mac/PC) ───────────────
    // Mappen velges én gang og huskes i IndexedDB. Andre nettlesere
    // (Safari, iPhone) faller tilbake til vanlig nedlasting.
    const canPickFolder = 'showDirectoryPicker' in window;

    function idb(mode, fn) {
      return new Promise((resolve, reject) => {
        const open = indexedDB.open('arkiv', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('kv');
        open.onerror = () => reject(open.error);
        open.onsuccess = () => {
          const req = fn(open.result.transaction('kv', mode).objectStore('kv'));
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        };
      });
    }
    const getDir = () => idb('readonly', s => s.get('dir')).catch(() => null);
    const setDir = dir => idb('readwrite', s => s.put(dir, 'dir')).catch(() => {});

    async function pickFolder() {
      try {
        const dir = await window.showDirectoryPicker({ id: 'arkiv', mode: 'readwrite' });
        await setDir(dir);
        $('folder-name').textContent = dir.name;
        return dir;
      } catch { return null; } // brukeren avbrøt
    }

    async function freeName(dir, name) {
      const dot = name.lastIndexOf('.');
      const base = dot > 0 ? name.slice(0, dot) : name;
      const ext = dot > 0 ? name.slice(dot) : '';
      for (let i = 1; ; i++) {
        const candidate = i === 1 ? name : `${base} (${i})${ext}`;
        try { await dir.getFileHandle(candidate); } catch { return candidate; }
      }
    }

    async function saveToFolder(f, btn) {
      let dir = await getDir();
      if (!dir) dir = await pickFolder();
      if (!dir) return;
      if (await dir.requestPermission({ mode: 'readwrite' }) !== 'granted') {
        alert('Fikk ikke lov til å lagre i mappen.');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Lagrer…';
      try {
        const res = await fetch(f.url);
        if (!res.ok) throw new Error(res.status);
        const handle = await dir.getFileHandle(await freeName(dir, f.name), { create: true });
        await res.body.pipeTo(await handle.createWritable());
        btn.textContent = 'Lagret ✓';
      } catch {
        btn.disabled = false;
        btn.textContent = 'Last ned';
        alert('Lagring feilet. Last siden på nytt og prøv igjen.');
      }
    }

    if (canPickFolder) {
      $('folder').classList.remove('hidden');
      $('folder-btn').addEventListener('click', pickFolder);
      getDir().then(dir => { if (dir) $('folder-name').textContent = dir.name; });
    }

    const api = (path, opts = {}) => fetch(WORKER_URL + path, {
      ...opts,
      headers: { ...(opts.headers || {}), 'X-Arkiv-Passord': password },
    });

    // ── Innlogging ─────────────────────────────────────────────
    async function login(pw) {
      password = pw;
      const res = await api('/login', { method: 'POST' }).catch(() => null);
      if (!res || !res.ok) {
        password = '';
        store.del('arkiv-pw');
        $('login-error').textContent = res ? 'Feil passord.' : 'Fikk ikke kontakt med serveren.';
        return;
      }
      store.set('arkiv-pw', pw);
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      loadList();
    }

    $('login-btn').addEventListener('click', () => login($('pw').value));
    $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pw').value); });
    $('logout').addEventListener('click', () => { store.del('arkiv-pw'); location.reload(); });
    if (password) login(password);

    // ── Liste ──────────────────────────────────────────────────
    async function loadList() {
      const list = $('list');
      const res = await api('/list').catch(() => null);
      if (!res || !res.ok) {
        list.innerHTML = '<p class="error">Klarte ikke å hente videoene.</p>';
        return;
      }
      const files = await res.json();
      if (!files.length) {
        list.innerHTML = '<p class="empty">Ingen videoer ennå.</p>';
        return;
      }
      list.innerHTML = '';
      for (const f of files) {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `
          <p class="name"></p>
          <p class="meta"></p>
          <div class="player"></div>
          <div class="actions">
            <button class="play">Se</button>
            <a class="dl">Last ned</a>
            <button class="save hidden">Last ned</button>
            <button class="del">Slett</button>
          </div>`;
        el.querySelector('.name').textContent = f.name;
        el.querySelector('.meta').textContent =
          [f.uploader, fmtDate(f.uploaded), fmtSize(f.size)].filter(Boolean).join(' · ');
        el.querySelector('.dl').href = f.url + '&dl=1';
        if (canPickFolder) {
          el.querySelector('.dl').classList.add('hidden');
          const save = el.querySelector('.save');
          save.classList.remove('hidden');
          save.addEventListener('click', () => saveToFolder(f, save));
        }
        el.querySelector('.play').addEventListener('click', e => {
          const player = el.querySelector('.player');
          if (player.firstChild) { player.innerHTML = ''; e.target.textContent = 'Se'; return; }
          const v = document.createElement('video');
          v.src = f.url; v.controls = true; v.playsInline = true; v.autoplay = true;
          player.appendChild(v);
          e.target.textContent = 'Skjul';
        });
        el.querySelector('.del').addEventListener('click', async () => {
          if (!confirm(`Slette «${f.name}»? Dette kan ikke angres.`)) return;
          const r = await api(`/delete?key=${encodeURIComponent(f.key)}`, { method: 'DELETE' }).catch(() => null);
          if (r && r.ok) el.remove(); else alert('Sletting feilet.');
        });
        list.appendChild(el);
      }
    }

    function fmtSize(b) {
      return b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB';
    }
    function fmtDate(d) {
      return new Date(d).toLocaleString('no-NO', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
